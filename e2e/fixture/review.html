      .capture { width: 96px; height: 96px; }
      .capture-type { width: 120px; height: 120px; }
    </style>
  </head>
  <body>
    <section class="light" id="faces-light"></section>
    <section class="dark" id="faces-dark"></section>
    <section class="light" id="sizes-light"></section>
    <section class="dark" id="sizes-dark"></section>
    <section class="light" id="skins"></section>
    <section class="light" id="types"></section>
    <div id="staging"></div>
