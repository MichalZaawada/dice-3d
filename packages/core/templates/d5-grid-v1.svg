<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="2048" height="1446" viewBox="0 0 2048 1446">
  <title>dice-3d D5 skin template (d5-grid-v1)</title>
  <desc>
    Paint on the "artwork" layer and export the whole page as PNG with the same aspect ratio
    (2048 x 1446 recommended). Hide the "guides" layer before exporting. Keep the "numbers"
    layer for numbers: 'in-texture', or hide it for numbers: 'overlay'. Every face is upright in its
    own cell; extend artwork slightly beyond the outlines to avoid seams. The dot marks the top of
    each label. Cell positions and the aspect ratio must not change.
  </desc>
  <g id="artwork" inkscape:groupmode="layer" inkscape:label="artwork">
    <rect id="artwork-background" x="0" y="0" width="2048" height="1446" fill="#f2ede4"/>
  </g>
  <g id="numbers" inkscape:groupmode="layer" inkscape:label="numbers" fill="none" stroke="#1d1b18" stroke-width="36.05" stroke-linecap="round" stroke-linejoin="round">
