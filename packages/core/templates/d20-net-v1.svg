<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="2048" height="1024" viewBox="0 0 2048 1024">
  <title>dice-3d D20 net template (d20-net-v1)</title>
  <desc>
    Paint on the "artwork" layer and export the whole page as PNG at any resolution with a 2:1 aspect ratio
    (2048 x 1024 recommended). Hide the "guides" layer before exporting. Keep the "numbers" layer for
    numbers: 'in-texture', or hide it for numbers: 'overlay'. Solid lines are face edges; extend artwork to the
    dashed bleed lines (24px at 2048 x 1024) to avoid seams. The dot marks vertex A: the face is upright
    when A points up. Triangle positions and the aspect ratio must not change.
  </desc>
