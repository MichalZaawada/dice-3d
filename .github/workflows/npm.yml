name: Publish npm packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish: OIDC; bootstrap: token + 2FA approval; stage: OIDC + 2FA approval'
        type: choice
        options: [publish, bootstrap, stage]
        default: publish
        required: true
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  checks:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      NPM_PUBLISH_MODE: ${{ inputs.mode || vars.NPM_PUBLISH_MODE || 'publish' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a release commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install npm with staged publishing support
        run: npm install --global npm@12.2.1
      - run: node scripts/publish.mjs --check
      - run: npm ci
      - run: npm run build:packages
      - run: npm run pack:verify
      - name: Publish or stage packages
        run: node scripts/publish.mjs
        env:
          # Tokens are exposed only to the explicit first-release bootstrap mode.
          NODE_AUTH_TOKEN: ${{ env.NPM_PUBLISH_MODE == 'bootstrap' && secrets.NPM_TOKEN || '' }}
